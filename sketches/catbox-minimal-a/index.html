<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Variant A — Bare Catbox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#0a0a0a;color:#e5e5e5}</style>
<body class="min-h-screen">
<header class="border-b border-neutral-800 sticky top-0 bg-[#0a0a0a]/90 backdrop-blur z-10">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="font-bold tracking-tight">imgof<span class="text-neutral-500 font-normal">.my.id</span></div>
    <div class="text-xs text-neutral-500">API · FAQ · Legal</div>
  </div>
</header>
<main class="max-w-3xl mx-auto px-4 py-10">
  <div class="border border-dashed border-neutral-700 rounded-xl py-14 text-center bg-neutral-900/40 hover:border-neutral-600 transition">
    <div class="text-3xl mb-2">⬆</div>
    <div class="font-medium">Drop images or paste (Ctrl+V)</div>
    <div class="text-xs text-neutral-500 mt-1">JPG PNG WEBP GIF SVG — 10 MB — 25 / page</div>
  </div>
  <div class="flex justify-end mt-2"><select class="bg-transparent text-xs text-neutral-400 border border-neutral-800 rounded px-2 py-1"><option>Permanent</option><option>1 hour</option><option>24 hours</option></select></div>
  <div class="mt-6 space-y-2" id="rows">
    <!-- row template bare: thumb name size check link -->
  </div>
  <p class="text-xs text-neutral-600 mt-3">3 files — <a class="underline">Copy all links</a></p>
</main>
<script>
const rows=[
 {name:"Ana Amari UNcensored.jpg",size:"395.6 KB",url:"https://imgof.my.id/i/vrODhN.jpg"},
 {name:"Ana (l) Amari.jpg",size:"100.4 KB",url:"https://imgof.my.id/i/Bng1kz.jpg"},
 {name:"Halal Slave.jpg",size:"249.6 KB",url:"https://imgof.my.id/i/Feh557.jpg"},
];
const c=document.getElementById('rows');
rows.forEach(r=>{
  const el=document.createElement('div');
  el.className='flex items-center gap-3 bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 group';
  el.innerHTML=`<img src="https://picsum.photos/seed/${r.url.slice(-6)}/80/80" class="w-10 h-10 rounded object-cover bg-neutral-800">
  <div class="flex-1 min-w-0"><div class="text-xs truncate">${r.name}</div><div class="text-[11px] text-neutral-500">${r.size}</div></div>
  <span class="text-emerald-400 text-xs">✓</span>
  <a class="text-xs text-blue-400 truncate max-w-[170px] underline">${r.url}</a>
  <button class="text-[11px] bg-white text-black px-2 py-1 rounded font-medium opacity-0 group-hover:opacity-100 transition">Copy</button>`;
  el.querySelector('button').onclick=function(){navigator.clipboard.writeText(r.url);this.textContent='Copied';setTimeout(()=>this.textContent='Copy',900)};
  c.appendChild(el);
});
</script>
</body></html>
