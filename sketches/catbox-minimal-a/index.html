<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Variant A — Catbox Bare</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#0a0a0a;color:#fafafa}</style>
<body class="min-h-screen">
<header class="border-b border-neutral-900 sticky top-0 bg-[#0a0a0a]/80 backdrop-blur z-10">
  <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="font-semibold tracking-tight">imgof<span class="text-neutral-500">.my.id</span></div>
    <div class="text-xs text-neutral-500">API · FAQ · Legal</div>
  </div>
</header>
<main class="max-w-2xl mx-auto px-4 py-10">
  <div class="border-2 border-dashed border-neutral-800 hover:border-neutral-600 rounded-xl py-12 text-center transition cursor-pointer">
    <div class="text-sm font-medium">Select or drop files</div>
    <div class="text-xs text-neutral-500 mt-1">paste anywhere · 25 per page · auto webp</div>
  </div>
  <div class="mt-6 space-y-2" id="rows"></div>
  <p class="text-xs text-neutral-600 mt-3">3 files — <a class="underline cursor-pointer">Copy all links</a></p>
</main>
<script>
const rows=[
 {name:"Ana Amari UNcensored.jpg",size:"395.6 KB",url:"https://imgof.my.id/i/vrODhN.jpg"},
 {name:"Ana (l) Amari.jpg",size:"100.4 KB",url:"https://imgof.my.id/i/Bng1kz.jpg"},
 {name:"Halal Slave.jpg",size:"249.6 KB",url:"https://imgof.my.id/i/Feh557.jpg"},
];
const c=document.getElementById('rows');
rows.forEach(r=>{
  const el=document.createElement('div');
  el.className='flex items-center gap-3 bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 group';
  el.innerHTML=`<img class="row-thumb w-10 h-10 rounded object-cover bg-neutral-800" alt="">
  <div class="flex-1 min-w-0"><div class="row-name text-xs truncate"></div><div class="row-size text-[11px] text-neutral-500"></div></div>
  <span class="text-emerald-400 text-xs">✓</span>
  <a class="row-link text-xs text-blue-400 truncate max-w-[170px] underline"></a>
  <button class="text-[11px] bg-white text-black px-2 py-1 rounded font-medium opacity-0 group-hover:opacity-100 transition">Copy</button>`;
  el.querySelector('.row-thumb').src = `https://picsum.photos/seed/${r.url.slice(-6)}/80/80`;
  el.querySelector('.row-name').textContent = r.name;
  el.querySelector('.row-size').textContent = r.size;
  const linkEl = el.querySelector('.row-link');
  linkEl.href = r.url;
  linkEl.textContent = r.url;
  el.querySelector('button').onclick=function(){navigator.clipboard.writeText(r.url);this.textContent='Copied';setTimeout(()=>this.textContent='Copy',900)};
  c.appendChild(el);
});
</script>
</body></html>
