<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Variant B — Catbox + per-row fmt</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#0f1115;color:#e8e8e8}</style>
<body class="min-h-screen">
<header class="border-b border-white/10 sticky top-0 bg-[#0f1115]/80 backdrop-blur z-10">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="font-semibold tracking-tight">imgof<span class="text-white/40">.my.id</span> <span class="text-[10px] bg-white/10 px-1.5 py-0.5 rounded ml-1">BETA</span></div>
    <div class="text-xs text-white/40">API · FAQ · Legal</div>
  </div>
</header>
<main class="max-w-3xl mx-auto px-4 py-10">
  <div class="bg-white/[0.04] border border-white/10 rounded-2xl p-1">
    <div class="border border-dashed border-white/15 rounded-xl py-12 text-center hover:border-white/25 transition cursor-pointer">
      <div class="inline-flex w-10 h-10 rounded-full bg-white text-black items-center justify-center text-lg mb-2">＋</div>
      <div class="text-sm font-medium">Drop or click to upload</div>
      <div class="text-xs text-white/40 mt-1">paste ready · 25 per page</div>
    </div>
  </div>
  <div class="flex items-center justify-between mt-3 text-xs"><span class="text-white/40">Auto WEBP compress &gt;1 MB</span><select class="bg-white/5 border border-white/10 rounded-full px-3 py-1 text-xs"><option>Permanent</option><option>1 hour</option></select></div>
  <div class="mt-6 space-y-2" id="rows"></div>
</main>
<script>
const rows=[
 {name:"Ana Amari UNcensored.jpg",size:"395.6 KB",url:"https://imgof.my.id/i/vrODhN.jpg"},
 {name:"Ana (l) Amari.jpg",size:"100.4 KB",url:"https://imgof.my.id/i/Bng1kz.jpg"},
 {name:"Halal Slave.jpg",size:"249.6 KB",url:"https://imgof.my.id/i/Feh557.jpg"},
];
const c=document.getElementById('rows');
rows.forEach(r=>{
  const el=document.createElement('div');
  el.className='bg-white/[0.04] border border-white/10 rounded-xl px-3 py-3';
  el.innerHTML=`
  <div class="flex items-center gap-3">
    <img class="row-thumb w-10 h-10 rounded-lg object-cover" alt="">
    <div class="flex-1 min-w-0"><div class="row-name text-xs truncate"></div><div class="row-size text-[11px] text-white/40"></div></div>
    <a class="row-link text-xs text-white/60 truncate max-w-[150px]"></a>
  </div>
  <div class="flex gap-1 mt-2 ml-13">
    <button data-fmt="direct" class="fmt text-[11px] px-2.5 py-1 rounded-full bg-white text-black font-medium">Direct</button>
    <button data-fmt="md" class="fmt text-[11px] px-2.5 py-1 rounded-full bg-white/10 hover:bg-white/15">Markdown</button>
    <button data-fmt="html" class="fmt text-[11px] px-2.5 py-1 rounded-full bg-white/10 hover:bg-white/15">HTML</button>
    <button data-fmt="bb" class="fmt text-[11px] px-2.5 py-1 rounded-full bg-white/10 hover:bg-white/15">BBCode</button>
  </div>`;
  el.querySelector('.row-thumb').src = `https://picsum.photos/seed/${r.url.slice(-6)}/80/80`;
  el.querySelector('.row-name').textContent = r.name;
  el.querySelector('.row-size').textContent = `${r.size} · ✓`;
  const linkEl = el.querySelector('.row-link');
  linkEl.textContent = r.url;
  linkEl.href = r.url;

  const map={direct:r.url, md:`![Image](${r.url})`, html:`<img src="${r.url}">`, bb:`[IMG]${r.url}[/IMG]`};
  el.querySelectorAll('.fmt').forEach(b=>{
    b.onclick=function(){
      navigator.clipboard.writeText(map[b.dataset.fmt]||r.url);
      const old=b.textContent; b.textContent='Copied!'; setTimeout(()=>b.textContent=old,900);
    };
  });
  c.appendChild(el);
});
</script>
</body></html>
