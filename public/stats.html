<body class="bg-[#0f1115] text-white font-sans min-h-screen flex flex-col justify-between p-4 sm:p-6 antialiased selection:bg-blue-600 selection:text-white">
<div class="container mx-auto px-4 py-8 max-w-4xl"><main class="space-y-6">
<div class="bg-[#0f1115] border border-white/10 rounded-2xl p-6">
<h2 class="text-sm font-bold text-blue-400 uppercase tracking-wide mb-3">Uploads / hari (30 hari)</h2>
<canvas id="upChart" width="800" height="280" style="width:100%;height:140px"></canvas>
<h2 class="text-sm font-bold text-blue-400 uppercase tracking-wide mt-6 mb-3">Storage / hari (GB)</h2>
<canvas id="stChart" width="800" height="280" style="width:100%;height:140px"></canvas>
<p class="text-xs text-white/40 mt-3" id="foot"></p>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<div class="bg-[#0f1115] border border-white/10 rounded-2xl p-6">
<h2 class="text-sm font-bold text-blue-400 uppercase tracking-wide mb-3">Files by type</h2>
<table id="byType" class="w-full text-sm"><tr class="text-xs text-white/40"><th class="text-left py-1">Type</th><th class="text-left py-1">Count</th></tr></table>
</div>
<div class="bg-[#0f1115] border border-white/10 rounded-2xl p-6">
<h2 class="text-sm font-bold text-blue-400 uppercase tracking-wide mb-3">Files by size</h2>
<table id="bySize" class="w-full text-sm"><tr class="text-xs text-white/40"><th class="text-left py-1">Size</th><th class="text-left py-1">Count</th></tr></table>
</div>
</div>
</main>
<footer class="text-center mt-10 pt-6 border-t border-white/10 text-xs text-white/40 flex flex-wrap justify-center gap-4">
<span>&copy; 2026 ImgOF</span>
<a href="/" class="text-white/60 hover:text-blue-300 underline">Beranda</a>
<a href="/docs" class="text-white/60 hover:text-blue-300 underline">API Docs</a>
<a href="/faq" class="text-white/60 hover:text-blue-300 underline">FAQ</a>
<a href="/status" class="text-white/60 hover:text-blue-300 underline">Status</a>
<a href="/stats" class="text-blue-400 font-semibold underline">Statistik</a>
<a href="/legal" class="text-white/60 hover:text-blue-300 underline">Legal</a>
<a href="/contact" class="text-white/60 hover:text-blue-300 underline">Kontak</a>
</footer>
</div>
<script>
function drawBar(canvas, labels, values, color){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, pad=28;
  ctx.clearRect(0,0,W,H);
  // grid lines
  ctx.strokeStyle='#1e293b'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=pad+i*((H-pad*2)/4); ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke(); }
  const max=Math.max(1,...values);
  const n=values.length||1;
  const bw=(W-pad*2)/n*0.62, gap=(W-pad*2)/n*0.38;
  // gradient fill
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,color);
  grad.addColorStop(1,color+'55');
  ctx.fillStyle=grad;
  values.forEach((v,i)=>{
    const x=pad+i*(bw+gap)+gap/2, h=(v/max)*(H-pad*2);
    const r=4;
    // rounded top
    ctx.beginPath();
    ctx.roundRect(x, H-pad-h, bw, h, [r,r,0,0]);
    ctx.fill();
  });
  ctx.fillStyle='#64748b'; ctx.font='11px system-ui';
  labels.forEach((l,i)=>{ if(i%Math.ceil(n/6)===0) ctx.fillText(l.slice(5), pad+i*(bw+gap)+gap/2, H-6); });
}
fetch('/api/public-stats').then(r=>r.json()).then(d=>{
  if(!d.success) return;
  const up=d.uploads_per_day||[], st=d.storage_per_day||[];
  drawBar(document.getElementById('upChart'), up.map(x=>x.day), up.map(x=>x.count), '#38bdf8');
  drawBar(document.getElementById('stChart'), st.map(x=>x.day), st.map(x=>x.gb), '#34d399');
  const bt=document.getElementById('byType'), bs=document.getElementById('bySize');
  const maxT=Math.max(1,...d.by_type.map(x=>x.count)), maxS=Math.max(1,...d.by_size.map(x=>x.count));
  const bar=(pct,color)=>`<span style="display:inline-block;height:10px;border-radius:4px;background:${color};width:${pct}%"></span>`;
  d.by_type.forEach(r=>{
    const w=(r.count/maxT*100).toFixed(0); const tr=document.createElement('tr'); tr.className='border-t border-white/10';
    const td1=document.createElement('td'); td1.className='py-1.5'; td1.textContent=r.mime;
    const td2=document.createElement('td'); td2.className='py-1.5'; td2.append(Object.assign(document.createElement('span'),{style:`display:inline-block;height:10px;border-radius:4px;background:#3b82f6;width:${w}%`}), document.createTextNode(' '+r.count));
    tr.append(td1,td2); bt.appendChild(tr);
  });
  d.by_size.forEach(r=>{
    const w=(r.count/maxS*100).toFixed(0); const tr=document.createElement('tr'); tr.className='border-t border-white/10';
    const td1=document.createElement('td'); td1.className='py-1.5'; td1.textContent=r.bucket;
    const td2=document.createElement('td'); td2.className='py-1.5'; td2.append(Object.assign(document.createElement('span'),{style:`display:inline-block;height:10px;border-radius:4px;background:#22c55e;width:${w}%`}), document.createTextNode(' '+r.count));
    tr.append(td1,td2); bs.appendChild(tr);
  });
  document.getElementById('foot').textContent=`${up.length} hari terakhir · total ${up.reduce((a,b)=>a+b.count,0)} file`;
}).catch(()=>{});
</script>
</body>
</html>
